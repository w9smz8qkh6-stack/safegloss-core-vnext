{% if form.non_field_errors %}
  <div class="error-summary" role="alert"><h2>There is a problem with this form</h2>{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="form-field{% if field.errors %} has-error{% endif %}">
    {{ field.label_tag }}{{ field }}{% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}{{ field.errors }}
  </div>
{% endfor %}
